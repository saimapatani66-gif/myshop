<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cart{
    background:white;
    color:#111;
    padding:10px 15px;
    border-radius:20px;
}

.hero{
    background:#222;
    color:white;
    text-align:center;
    padding:55px 15px;
}

.hero h2{
    font-size:32px;
    margin-bottom:10px;
}

.products{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px #ccc;
}

.product-img{
    height:180px;
    background:#ddd;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    margin-bottom:15px;
}

.product h3{
    margin-bottom:8px;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:12px;
}

button{
    background:#111;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:7px;
    cursor:pointer;
}

button:hover{
    background:#444;
}

.checkout{
    max-width:500px;
    margin:20px auto 40px;
    background:white;
    padding:25px;
    border-radius:12px;
}

.checkout h2{
    margin-bottom:15px;
}

.checkout input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:7px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
    <h1>🛍️ My Shop</h1>

    <div class="cart">
        🛒 Cart:
        <span id="cartCount">0</span>
    </div>
</header>

<section class="hero">
    <h2>Welcome to My Shop</h2>
    <p>Best Products • Best Prices</p>
</section>

<section class="products">

    <div class="product">
        <div class="product-img">👕</div>
        <h3>Premium T-Shirt</h3>
        <p>High quality cotton T-shirt</p>
        <div class="price">Rs. 1500</div>

        <button onclick="addCart(1500)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <div class="product-img">👟</div>
        <h3>Sports Shoes</h3>
        <p>Comfortable running shoes</p>
        <div class="price">Rs. 3500</div>

        <button onclick="addCart(3500)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <div class="product-img">🎧</div>
        <h3>Wireless Headphones</h3>
        <p>Clear sound and long battery</p>
        <div class="price">Rs. 2500</div>

        <button onclick="addCart(2500)">
            Add to Cart
        </button>
    </div>

</section>

<section class="checkout">

    <h2>🛒 Checkout</h2>

    <p>
        Total:
        <strong>Rs. <span id="total">0</span></strong>
    </p>

    <br>

    <input id="name" type="text" placeholder="Your Name">

    <input id="phone" type="tel" placeholder="Phone Number">

    <input id="address" type="text" placeholder="Delivery Address">

    <br><br>

    <button onclick="order()">
        Place Order
    </button>

</section>

<footer>
    © 2026 My Shop
</footer>

<script>

let cart = 0;
let total = 0;

function addCart(price){

    cart++;
    total += price;

    document.getElementById("cartCount").innerText = cart;
    document.getElementById("total").innerText = total;

    alert("Product added to cart!");
}

function order(){

    let name =
        document.getElementById("name").value;

    let phone =
        document.getElementById("phone").value;

    let address =
        document.getElementById("address").value;

    if(name === "" || phone === "" || address === ""){
        alert("Please fill all details!");
        return;
    }

    if(cart === 0){
        alert("Please add a product first!");
        return;
    }

    alert(
        "✅ Order placed successfully!\n\n" +
        "Customer: " + name +
        "\nPhone: " + phone +
        "\nAddress: " + address +
        "\nTotal: Rs. " + total
    );
}

</script>

</body>
</html>
