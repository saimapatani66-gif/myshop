<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us - My Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      font-size: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .contact-info {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .contact-info p {
      margin: 8px 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 50px;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 15px;
      }

      header h2 {
        font-size: 19px;
      }

      nav a {
        font-size: 14px;
        margin-left: 8px;
      }

      .container {
        margin: 20px 12px;
        padding: 25px 18px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>🛍️ My Shop</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">

    <h1>Contact Us</h1>

    <p class="intro">
      Have a question about our products or your order?
      We'd be happy to hear from you.
